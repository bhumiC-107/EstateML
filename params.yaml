data:
  path: bengaluru_house_prices.csv
  test_size: 0.2
  random_state: 42

training:
  target: price
  models:
    - random_forest
    - extra_trees
    - hist_gradient_boosting
  cv_folds: 5
  random_forest:
    n_estimators: 300
    max_depth: null
  extra_trees:
    n_estimators: 300
    max_depth: null
  hist_gradient_boosting:
    max_iter: 100
